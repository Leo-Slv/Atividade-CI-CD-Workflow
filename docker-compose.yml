services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crud_pessoas
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d crud_pessoas']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    image: atividade-ci-cd-workflow-api:latest
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@db:5432/crud_pessoas
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    image: atividade-ci-cd-workflow-web:latest
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
